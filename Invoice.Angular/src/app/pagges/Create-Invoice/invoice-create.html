<div class="container mt-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">

    <div>
      <h2 class="fw-bold mb-1">
        <i class="bi bi-receipt me-2"></i>
        Create Invoice
      </h2>

      <p class="text-muted mb-0">
        Enter invoice information and create a new invoice.
      </p>
    </div>

    <a
      routerLink="/invoice"
      class="btn btn-outline-secondary">

      <i class="bi bi-arrow-left me-1"></i>
      Back to Invoices

    </a>

  </div>


  <!-- Card -->
  <div class="card shadow-sm border-0">

    <div class="card-body p-4">

      <form
        [formGroup]="invoiceForm"
        (ngSubmit)="onSubmit()">

        <!-- Tabs -->
        <ul class="nav nav-tabs mb-4">

          <li class="nav-item">

            <button
              type="button"
              class="nav-link"
              [class.active]="activeTab === 'invoice-info'"
              (click)="activeTab = 'invoice-info'">

              <i class="bi bi-file-text me-1"></i>
              Invoice Info

            </button>

          </li>

          <li class="nav-item">

            <button
              type="button"
              class="nav-link"
              [class.active]="activeTab === 'issuer'"
              (click)="activeTab = 'issuer'">

              <i class="bi bi-building me-1"></i>
              Issuer

            </button>

          </li>

          <li class="nav-item">

            <button
              type="button"
              class="nav-link"
              [class.active]="activeTab === 'receiver'"
              (click)="activeTab = 'receiver'">

              <i class="bi bi-person me-1"></i>
              Receiver

            </button>

          </li>

          <li class="nav-item">

            <button
              type="button"
              class="nav-link"
              [class.active]="activeTab === 'lines'"
              (click)="activeTab = 'lines'">

              <i class="bi bi-list-ul me-1"></i>
              Invoice Lines

            </button>

          </li>

        </ul>


        <!-- Content -->

        <div class="mb-4">

          @if (activeTab === 'invoice-info') {

            <app-invoice-info
              [form]="invoiceForm">
            </app-invoice-info>

          }

          @if (activeTab === 'issuer') {

            <app-issuer
              [form]="invoiceForm">
            </app-issuer>

          }

          @if (activeTab === 'receiver') {

            <app-receiver
              [form]="invoiceForm">
            </app-receiver>

          }

          @if (activeTab === 'lines') {

            <app-invoice-line
              [form]="invoiceForm">
            </app-invoice-line>

          }

        </div>


        <!-- Footer -->

        <div class="border-top pt-4">

          <div class="d-flex justify-content-between">

            <a
              routerLink="/invoice"
              class="btn btn-outline-secondary">

              <i class="bi bi-x-lg me-1"></i>
              Cancel

            </a>

            <button
              type="submit"
              class="btn btn-primary px-4">

              <i class="bi bi-check-lg me-1"></i>
              Create Invoice

            </button>

          </div>

        </div>

      </form>

    </div>

  </div>


  <!-- Result -->

  @if (validationResult !== null) {

    <div class="card shadow-sm border-0 mt-4">

      <div class="card-body p-4">

        <app-invoice-result
          [result]="validationResult">
        </app-invoice-result>

      </div>

    </div>

  }

</div>
